// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

ext {
    minSdkVersion = 14
    targetSdkVersion = 36
    compileSdkVersion = 36
    versionCode = 41
    versionName = "1.2.1"
    appcompat_v7 = "com.android.support:appcompat-v7:28.0.0"
    androidx_appcompat = "androidx.appcompat:appcompat:1.1.0"
    publishedGroupId = 'com.github.solon-foot'
    tlogVersion = '1.1.2'
}
allprojects {
    group = rootProject.ext.publishedGroupId
    version = rootProject.ext.tlogVersion

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}